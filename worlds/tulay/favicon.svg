<!--
  Tulay's mark: a bridge (tulay) arching over water, under Seiza's own
  twilight-into-starfield (the same gradient stops as public/favicon.svg),
  so the worlds read as one family in a row of tabs. build.mjs copies this
  over dist/favicon.svg in Tulay's build only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tulay">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c26"/>
      <stop offset="42%" stop-color="#1b1546"/>
      <stop offset="72%" stop-color="#4b2a66"/>
      <stop offset="92%" stop-color="#a85570"/>
      <stop offset="100%" stop-color="#e8823f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <g fill="#ffffff">
      <circle cx="10" cy="9" r="0.9" opacity="0.95"/>
      <circle cx="24" cy="6" r="0.6" opacity="0.7"/>
      <circle cx="47" cy="8" r="0.8" opacity="0.9"/>
      <circle cx="57" cy="16" r="0.5" opacity="0.6"/>
    </g>
    <!-- Water. -->
    <rect x="0" y="46" width="64" height="18" fill="#123a52"/>
    <path d="M4 52 q4 -2 8 0 t8 0 M36 56 q4 -2 8 0 t8 0" stroke="#7fc4d6" stroke-width="1.4" fill="none" opacity="0.8"/>
    <!-- The bridge: an arch, its deck, and the posts between. -->
    <path d="M6 46 Q32 18 58 46" fill="none" stroke="#e8c37a" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="4" y="36" width="56" height="3" rx="1.2" fill="#e8c37a"/>
    <g stroke="#e8c37a" stroke-width="1.6">
      <line x1="18" y1="31" x2="18" y2="36"/>
      <line x1="32" y1="27" x2="32" y2="36"/>
      <line x1="46" y1="31" x2="46" y2="36"/>
    </g>
  </g>
</svg>
